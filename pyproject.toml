[project]
name = "arxiv-paper-suggester"
version = "1.1.1"
description = "Multi-signal arXiv recommender + RAG with citations"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "streamlit>=1.38,<2",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "numpy>=1.26,<3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.2.0",
  "torchvision>=0.19",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "pymupdf4llm>=0.0.17",
  "google-genai>=1.0",
  "openai>=1.0",
]

[tool.uv]
package = false
