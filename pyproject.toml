[project]
name = "arxiv-paper-suggester"
version = "1.1.0"
description = "Multi-signal arXiv recommender + RAG with citations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "requests>=2.31",
  "pymupdf4llm>=0.0.17",
  "google-genai>=1.0",
  "streamlit>=1.38",
  "openai>=1.0",
  "torchvision>=0.19",
]

[tool.uv]
package = false
